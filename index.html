<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>District Court Kozhikode - Mobile IT Asset Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-blue: #004085;
            --brand-blue: #2563eb;
            --bg-gradient: #eef2f7;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            margin: 0; 
            background: #cbd5e1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        /* 📱 EXACT MOBILE CARD CONTAINER (IMAGE DESIGN) */
        .mobile-frame {
            width: 100%;
            max-width: 410px;
            min-height: 92vh;
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header Bar */
        .mobile-header {
            background: #003366;
            color: #ffffff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 800;
        }

        .sync-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        }
        .sync-online { background: #10b981; }
        .sync-syncing { background: #f59e0b; }
        .sync-offline { background: #ef4444; }

        /* Default Court Selector Bar */
        .default-court-bar {
            background: #0f172a;
            color: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .default-court-bar select {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.78rem;
            width: 55%;
            outline: none;
        }
        .default-court-bar select option { background: #0f172a; color: #fff; }

        /* View Content Areas */
        .view-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }
        .view-content.active { display: block; }

        /* 🏠 HOME SCREEN UI (EXACT MATCH TO YOUR IMAGE) */
        .home-brand-box {
            text-align: center;
            margin: 40px 0 30px 0;
        }
        .home-brand-icon {
            font-size: 3rem;
            color: #2563eb;
            margin-bottom: 12px;
        }
        .home-brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #003366;
        }
        .home-brand-sub {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* White Action Cards */
        .app-action-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-action-card:active {
            transform: scale(0.98);
            background: #f8fafc;
        }
        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .icon-blue { background: #eff6ff; color: #2563eb; }
        .icon-yellow { background: #fef3c7; color: #d97706; }

        .card-text-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #0f172a;
        }
        .card-text-desc {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* Forms & Inputs */
        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .form-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background: #f8fafc;
        }
        .form-group input:focus { border-color: #2563eb; background: #fff; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .device-row {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
        }
        .remove-dev-btn {
            position: absolute; right: 8px; top: 8px; color: #ef4444; font-size: 0.85rem; cursor: pointer;
        }

        .btn {
            width: 100%; padding: 12px; border-radius: 10px; font-size: 0.88rem; font-weight: 800;
            border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #e2e8f0; color: #0f172a; }

        /* Manage Assets Cards */
        .asset-item-card {
            background: #ffffff; border-radius: 12px; padding: 12px; margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); cursor: pointer; border: 1px solid #e2e8f0;
        }
        .asset-item-card:active { background: #eff6ff; border-color: #2563eb; }
        .seat-tag { font-size: 0.72rem; font-weight: 800; color: #2563eb; }
        .staff-name { font-size: 0.9rem; font-weight: 800; margin: 2px 0 4px 0; }
        .serial-no { font-family: monospace; font-weight: 700; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 0.75rem; }

        /* Edit Modal Overlay */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; z-index: 100; }
        .modal-box { position: fixed; bottom: 0; left: 0; width: 100vw; max-height: 85vh; overflow-y: auto; background: #ffffff; border-radius: 20px 20px 0 0; padding: 18px; z-index: 101; display: none; }
    </style>
</head>
<body>

    <!-- 📱 MAIN MOBILE CONTAINER -->
    <div class="mobile-frame">
        
        <!-- Header -->
        <div class="mobile-header">
            <div>District Court IT Cell</div>
            <div><span class="sync-dot sync-syncing" id="syncDot"></span></div>
        </div>

        <!-- Global Default Court selector -->
        <div class="default-court-bar">
            <span><i class="fa-solid fa-building-columns"></i> Default Court:</span>
            <select id="globalDefaultCourtSelect" onchange="updateDefaultCourtSelection()"></select>
        </div>

        <!-- DATALISTS FOR AUTO-COMPLETION / SUGGESTIONS -->
        <datalist id="listDesignations"></datalist>
        <datalist id="listMakes"></datalist>
        <datalist id="listModels"></datalist>
        <datalist id="listSerials"></datalist>

        <!-- 1. HOME VIEW (MATCHING IMAGE) -->
        <div id="homeView" class="view-content active">
            <div class="home-brand-box">
                <i class="fa-solid fa-scale-balanced home-brand-icon"></i>
                <div class="home-brand-title">District Court Kozhikode</div>
                <div class="home-brand-sub">Mobile Asset Management System</div>
            </div>

            <div class="app-action-card" onclick="openView('addAssetView')">
                <div class="icon-circle icon-blue"><i class="fa-solid fa-plus"></i></div>
                <div>
                    <div class="card-text-title">Add Asset Entry</div>
                    <div class="card-text-desc">Register new staff hardware allotting</div>
                </div>
            </div>

            <div class="app-action-card" onclick="openView('manageAssetView')">
                <div class="icon-circle icon-yellow"><i class="fa-solid fa-pen-to-square"></i></div>
                <div>
                    <div class="card-text-title">Edit Asset Entry</div>
                    <div class="card-text-desc">Search & modify existing device details</div>
                </div>
            </div>
        </div>

        <!-- 2. ADD ASSET VIEW -->
        <div id="addAssetView" class="view-content">
            <div class="nav-back-btn" onclick="openView('homeView')"><i class="fa-solid fa-arrow-left"></i> Back to Home</div>
            
            <div class="form-card">
                <div class="form-group">
                    <label>Target Court Jurisdiction</label>
                    <select id="addCourtSelect"></select>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>Staff Name *</label><input type="text" id="addStaff" placeholder="e.g. Midhun P"></div>
                    <div class="form-group"><label>Seat / Designation *</label><input type="text" id="addDesig" list="listDesignations" placeholder="Select Designation..."></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>Install Date</label><input type="date" id="addInstallDate"></div>
                    <div class="form-group"><label>OM No.</label><input type="text" id="addOmNo" placeholder="OM/2026/102"></div>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <strong style="font-size:0.78rem; text-transform:uppercase; color:#2563eb;">Allocated Devices</strong>
                <button class="btn btn-secondary" style="width:auto; padding:4px 10px; font-size:0.75rem;" onclick="addDeviceRow()"><i class="fa-solid fa-plus"></i> Add Device</button>
            </div>

            <div id="devicesContainer"></div>

            <button class="btn btn-primary" style="margin-top:10px;" onclick="saveMultiAssets()"><i class="fa-solid fa-floppy-disk"></i> Save Asset</button>
        </div>

        <!-- 3. EDIT / MANAGE ASSET VIEW -->
        <div id="manageAssetView" class="view-content">
            <div class="nav-back-btn" onclick="openView('homeView')"><i class="fa-solid fa-arrow-left"></i> Back to Home</div>

            <div class="form-card">
                <div class="form-group" style="margin:0;">
                    <label>Select Court Jurisdiction</label>
                    <select id="manageCourtSelect" onchange="renderSeatWiseAssets()"></select>
                </div>
            </div>

            <div class="form-group">
                <input type="text" id="mobileSearchInput" placeholder="🔍 Search Staff, Seat, Serial, Model..." onkeyup="renderSeatWiseAssets()">
            </div>

            <div id="seatWiseAssetsContainer"></div>
        </div>

    </div>

    <!-- EDIT ASSET MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-box" id="editAssetModal">
        <h4 style="margin-top:0; color:#003366;">Edit Asset Details</h4>
        <input type="hidden" id="editOldSerial">

        <div class="grid-2">
            <div class="form-group"><label>Staff Name</label><input type="text" id="editStaff"></div>
            <div class="form-group"><label>Designation</label><input type="text" id="editDesig" list="listDesignations"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label>Make / Brand</label><input type="text" id="editMake" list="listMakes"></div>
            <div class="form-group"><label>Model Name</label><input type="text" id="editModel" list="listModels"></div>
        </div>
        <div class="form-group">
            <label>Serial Number (Unique)</label>
            <input type="text" id="editSerial" list="listSerials" style="font-family:monospace; font-weight:bold;">
        </div>
        <div class="form-group">
            <label>Operational Status</label>
            <select id="editStatus">
                <option value="Active">Active / Working</option>
                <option value="Defective">Defective / Complaint</option>
                <option value="Not Allotted">Not Allotted / Spare Stock</option>
                <option value="Not in Use">Not in Use / Idle</option>
                <option value="Moved to E-Waste">Condemned (E-Waste)</option>
            </select>
        </div>
        <div class="grid-2">
            <div class="form-group"><label>Install Date</label><input type="date" id="editInstallDate"></div>
            <div class="form-group"><label>OM No.</label><input type="text" id="editOmNo"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveEditAsset()">Update Asset</button>
        </div>
    </div>

    <script>
        const apiURL = 'https://script.google.com/macros/s/AKfycbzAgmvDfO_qJDRWkWf1YzRtiMkEz7jqHHgJ5ZrOzJnOMNeGcV8PTzBCSpXL0KpNEE0e/exec';
        
        const defaultCourts = [
            { id: 'Jfcm1', name: 'JFCM Court - I, Kozhikode' },
            { id: 'Jfcm6', name: 'JFCM Court - VI, Kozhikode' },
            { id: 'Adc', name: 'Additional District Court' },
            { id: 'Subcourt', name: 'Sub Court, Kozhikode' }
        ];

        let courtsList = [...defaultCourts];
        let globalStore = {};
        let masterDataStore = { designations: [], makes: [], models: [], serials: [] };
        let defaultSelectedCourt = '';

        window.onload = function() {
            loadLocalCache();
            populateCourtDropdowns();
            loadAllData();
        };

        function openView(viewId) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if(viewId === 'addAssetView') {
                if(document.getElementById('devicesContainer').children.length === 0) addDeviceRow();
                document.getElementById('addCourtSelect').value = defaultSelectedCourt;
            }
            if(viewId === 'manageAssetView') {
                document.getElementById('manageCourtSelect').value = defaultSelectedCourt;
                renderSeatWiseAssets();
            }
        }

        function loadLocalCache() {
            try {
                const cached = localStorage.getItem('dc_it_cache_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    courtsList = parsed.courtsList || defaultCourts;
                    globalStore = parsed.globalStore || {};
                    masterDataStore = parsed.masterDataStore || masterDataStore;
                    populateDatalists();
                }
                const savedDefCourt = localStorage.getItem('default_court_pref');
                if(savedDefCourt) defaultSelectedCourt = savedDefCourt;
            } catch(e){}
        }

        function populateDatalists() {
            populateSingleDatalist('listDesignations', masterDataStore.designations);
            populateSingleDatalist('listMakes', masterDataStore.makes);
            populateSingleDatalist('listModels', masterDataStore.models);
            populateSingleDatalist('listSerials', masterDataStore.serials);
        }

        function populateSingleDatalist(elementId, items) {
            const dl = document.getElementById(elementId);
            if(!dl) return;
            dl.innerHTML = '';
            (items || []).forEach(i => { dl.innerHTML += `<option value="${escapeHTML(i)}">`; });
        }

        function jsonpFetch(url) {
            return new Promise((resolve) => {
                const callbackName = 'jp_cb_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    if(document.getElementById(callbackName)) document.body.removeChild(document.getElementById(callbackName));
                    resolve(data);
                };
                const script = document.createElement('script');
                script.id = callbackName;
                script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
                script.onerror = function() { resolve(null); };
                document.body.appendChild(script);
            });
        }

        async function loadAllData() {
            document.getElementById('syncDot').className = 'sync-dot sync-syncing';
            try {
                const data = await jsonpFetch(`${apiURL}?action=getAllData`);
                if(data && data.courtsData) {
                    courtsList = data.courtsList && data.courtsList.length > 0 ? data.courtsList : defaultCourts;
                    globalStore = data.courtsData || {};
                    
                    if(data.master) {
                        masterDataStore.designations = data.master.designations || [];
                        masterDataStore.makes = data.master.makes || [];
                        masterDataStore.models = data.master.models || [];
                        masterDataStore.serials = data.master.serials || [];
                        populateDatalists();
                    }

                    populateCourtDropdowns();
                    if(document.getElementById('manageAssetView').classList.contains('active')) renderSeatWiseAssets();
                    
                    document.getElementById('syncDot').className = 'sync-dot sync-online';
                } else {
                    document.getElementById('syncDot').className = 'sync-dot sync-offline';
                }
            } catch(e) { document.getElementById('syncDot').className = 'sync-dot sync-offline'; }
        }

        function populateCourtDropdowns() {
            const globalSel = document.getElementById('globalDefaultCourtSelect');
            const addSel = document.getElementById('addCourtSelect');
            const manageSel = document.getElementById('manageCourtSelect');

            let html = '';
            courtsList.forEach(c => { html += `<option value="${c.id}">${c.name}</option>`; });

            globalSel.innerHTML = html;
            addSel.innerHTML = html;
            manageSel.innerHTML = html;

            if(!defaultSelectedCourt && courtsList.length > 0) defaultSelectedCourt = courtsList[0].id;

            globalSel.value = defaultSelectedCourt;
            addSel.value = defaultSelectedCourt;
            manageSel.value = defaultSelectedCourt;
        }

        function updateDefaultCourtSelection() {
            const val = document.getElementById('globalDefaultCourtSelect').value;
            defaultSelectedCourt = val;
            localStorage.setItem('default_court_pref', val);
            document.getElementById('addCourtSelect').value = val;
            document.getElementById('manageCourtSelect').value = val;
            if(document.getElementById('manageAssetView').classList.contains('active')) renderSeatWiseAssets();
        }

        /* ADD ASSET DEVICE ROW WITH DATALISTS */
        function addDeviceRow() {
            const container = document.getElementById('devicesContainer');
            const rowId = 'dev_' + Date.now();
            const html = `
                <div class="device-row" id="${rowId}">
                    <i class="fa-solid fa-trash remove-dev-btn" onclick="document.getElementById('${rowId}').remove()"></i>
                    <div class="grid-2">
                        <div class="form-group" style="margin:0;"><label>Make/Item</label><input type="text" class="dev-make" list="listMakes" placeholder="Desktop, Printer"></div>
                        <div class="form-group" style="margin:0;"><label>Model</label><input type="text" class="dev-model" list="listModels" placeholder="Veriton, M2170"></div>
                    </div>
                    <div class="form-group" style="margin:6px 0 0;"><label>Serial No *</label><input type="text" class="dev-serial" list="listSerials" placeholder="Serial Number"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function saveMultiAssets() {
            const courtId = document.getElementById('addCourtSelect').value;
            const staff = document.getElementById('addStaff').value.trim();
            const desig = document.getElementById('addDesig').value.trim();
            const installDate = document.getElementById('addInstallDate').value;
            const omNo = document.getElementById('addOmNo').value.trim();

            const rows = document.querySelectorAll('.device-row');
            let devices = [];

            rows.forEach(r => {
                const make = r.querySelector('.dev-make').value.trim();
                const model = r.querySelector('.dev-model').value.trim();
                const serial = r.querySelector('.dev-serial').value.trim().toUpperCase();
                if(serial) devices.push({ make, model, serial });
            });

            if(!staff || !desig) return Swal.fire('Required', 'Staff Name & Seat/Designation required!', 'error');
            if(devices.length === 0) return Swal.fire('Required', 'Please enter at least one Serial No!', 'error');

            if(!globalStore[courtId]) globalStore[courtId] = { assets: [], ewaste: [] };
            devices.forEach(d => {
                globalStore[courtId].assets.push([desig, staff, d.make, d.serial, d.model, 'Active', installDate, omNo, '', '', '', '']);
            });

            Swal.fire({icon:'success', title:'Asset Saved!', showConfirmButton:false, timer:1200});
            document.getElementById('addStaff').value = '';
            document.getElementById('addDesig').value = '';
            document.getElementById('devicesContainer').innerHTML = '';
            addDeviceRow();

            fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'saveMultiAssets', page: courtId, staff, desig, installDate, omNo, devices })
            });
        }

        /* MANAGE / EDIT ASSETS */
        function renderSeatWiseAssets() {
            const courtId = document.getElementById('manageCourtSelect').value;
            const q = document.getElementById('mobileSearchInput').value.toLowerCase().trim();
            const container = document.getElementById('seatWiseAssetsContainer');

            const assets = globalStore[courtId] ? globalStore[courtId].assets || [] : [];
            container.innerHTML = '';

            let filtered = assets.filter(a => {
                return String(a[0]||'').toLowerCase().includes(q) ||
                       String(a[1]||'').toLowerCase().includes(q) ||
                       String(a[2]||'').toLowerCase().includes(q) ||
                       String(a[3]||'').toLowerCase().includes(q) ||
                       String(a[4]||'').toLowerCase().includes(q);
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px; font-size:0.8rem;">No assets found for this court.</div>`;
                return;
            }

            filtered.forEach((a) => {
                const realIndex = assets.findIndex(orig => orig[3] === a[3]);
                container.innerHTML += `
                    <div class="asset-item-card" onclick="openEditModal('${courtId}', ${realIndex})">
                        <div class="seat-tag">${escapeHTML(a[0])||'Seat Unassigned'}</div>
                        <div class="staff-name">${escapeHTML(a[1])||'Staff Unassigned'}</div>
                        <div style="font-size:0.78rem; color:#64748b;">
                            <b>${escapeHTML(a[2])} ${escapeHTML(a[4])}</b><br>
                            S/N: <span class="serial-no">${escapeHTML(a[3])}</span> | Status: <b>${escapeHTML(a[5]||'Active')}</b>
                        </div>
                    </div>
                `;
            });
        }

        function openEditModal(courtId, index) {
            const item = globalStore[courtId].assets[index];
            if(!item) return;

            document.getElementById('editDesig').value = item[0] || '';
            document.getElementById('editStaff').value = item[1] || '';
            document.getElementById('editMake').value = item[2] || '';
            document.getElementById('editOldSerial').value = item[3] || '';
            document.getElementById('editSerial').value = item[3] || '';
            document.getElementById('editModel').value = item[4] || '';
            document.getElementById('editStatus').value = item[5] || 'Active';
            document.getElementById('editInstallDate').value = item[6] || '';
            document.getElementById('editOmNo').value = item[7] || '';

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('editAssetModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('editAssetModal').style.display = 'none';
        }

        function saveEditAsset() {
            const courtId = document.getElementById('manageCourtSelect').value;
            const oldSerial = document.getElementById('editOldSerial').value;
            const newSerial = document.getElementById('editSerial').value.trim().toUpperCase();

            if(!newSerial) return Swal.fire('Required', 'Serial Number cannot be empty.', 'error');

            const updatedRow = [
                document.getElementById('editDesig').value,
                document.getElementById('editStaff').value,
                document.getElementById('editMake').value,
                newSerial,
                document.getElementById('editModel').value,
                document.getElementById('editStatus').value,
                document.getElementById('editInstallDate').value,
                document.getElementById('editOmNo').value, '', '', '', ''
            ];

            const idx = globalStore[courtId].assets.findIndex(a => a[3] === oldSerial);
            if(idx !== -1) globalStore[courtId].assets[idx] = updatedRow;

            closeEditModal();
            renderSeatWiseAssets();
            Swal.fire({icon:'success', title:'Asset Updated!', showConfirmButton:false, timer:1200});

            fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'editAsset', page: courtId, oldSerial,
                    newDesig: updatedRow[0], newStaff: updatedRow[1], newMake: updatedRow[2],
                    newSerial: updatedRow[3], newModel: updatedRow[4], newStatus: updatedRow[5],
                    newInstallDate: updatedRow[6], newOmNo: updatedRow[7]
                })
            });
        }

        function escapeHTML(str) { return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    </script>
</body>
</html>
